<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <h1 class="navbar-brand">4vPizzeria</h1>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <div class="navbar-nav mx-auto align-items-center gap-4 py-2 py-lg-0">
                    <app-navbar-button label="Pizzas" [active]="activeCategory() === 'pizza'"
                        (clicked)="selectCategory('pizza')" />
                    <app-navbar-button label="Bebidas" [active]="activeCategory() === 'drink'"
                        (clicked)="selectCategory('drink')" />
                    <app-navbar-button label="Postres" [active]="activeCategory() === 'dessert'"
                        (clicked)="selectCategory('dessert')" />
                    <app-navbar-button label="Ofertas" [active]="activeCategory() === 'offers'"
                        (clicked)="selectCategory('offers')" />
                    <app-navbar-button label="Novedades" [active]="activeCategory() === 'news'"
                        (clicked)="selectCategory('news')" />
                </div>
            </div>
        </div>
    </nav>
</header>
