<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        @if (!showFilters()) {
        <a routerLink="/" class="btn btn-light back-button">← Volver a la carta</a>
        }
        <div class="order-lg-last ms-auto me-3 me-lg-0">
            <app-cart-button [count]="cartCount()" />
        </div>
        @if (showFilters()) {
        <button class="navbar-toggler" type="button" data-bs-theme="dark" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
            aria-controls="navbarMenu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <div class="navbar-nav mx-auto align-items-center gap-4 py-2 py-lg-0">
                @for (category of categories; track category.id) {
                <app-navbar-button [label]="category.label" [active]="activeCategory() === category.id"
                    (clicked)="selectCategory(category.id)" />
                }
            </div>
            <app-search-bar class="navbar-search" inputId="ingredient-search" (search)="searchIngredient($event)" />
        </div>
        }
    </div>
</nav>
