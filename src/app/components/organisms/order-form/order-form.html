<div class="container py-5">
    <form class="card order-form">
        <app-form-field label="Nombre" inputId="name" [control]="form.controls.name" />
        <app-form-field label="Teléfono" inputId="phone" type="tel" [control]="form.controls.phone" />
        <app-form-field label="Dirección" inputId="address" [control]="form.controls.address" />
        <app-card-button label="Confirmar pedido" (clicked)="submit()" />
    </form>
</div>
