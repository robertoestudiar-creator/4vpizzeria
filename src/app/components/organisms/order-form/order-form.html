<div class="container py-5">
    <form class="card order-form">
        <app-form-field label="Nombre" inputId="name" [(value)]="name" />
        <app-form-field label="Teléfono" inputId="phone" type="tel" [(value)]="phone" />
        <app-form-field label="Dirección" inputId="address" [(value)]="address" />
        <app-card-button label="Confirmar pedido" (clicked)="submit()" />
    </form>
</div>
