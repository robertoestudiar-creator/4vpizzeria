<app-navbar [showFilters]="false" [cartCount]="cartService.count()" />
<main class="container py-5 formulario">
    @if (thanks()) {
    <div class="alert alert-success thanks" role="status">¡Gracias por tu pedido!</div>
    }
    <div class="row g-4">
        <div class="col-12 col-lg-6">
            <app-order-summary [lines]="cartService.cartLines()" />
        </div>
        <div class="col-12 col-lg-6">
            <app-delivery-form [canPay]="cartService.count() > 0" (paid)="onPaid()" />
        </div>
    </div>
</main>
