<section class="card product-card">
    <img [src]="product().imageUrl" [alt]="product().name" />
    <div class="content">
        <div>
            <app-product-card-title [text]="product().name" />
            @if (product().ingredients.length > 0) {
                <p class="ingredients">{{ product().ingredients.join(', ') }}</p>
            }
            <p class="price">{{ product().price }} €</p>
        </div>
        <div class="actions">
            <app-quantity-selector [quantity]="quantity()" (quantityChange)="changeQuantity($event)" />
            <app-card-button label="Añadir al pedido" (clicked)="addToOrder()" />
        </div>
    </div>
</section>
