<div class="search-bar">
    <div class="input-group">
        <input #field [id]="inputId()" [type]="type()" class="form-control border-end-0 shadow-none" [placeholder]="placeholder()" [attr.aria-label]="placeholder()" (keyup.enter)="onSearch(field.value)">
        <app-search-button label="Buscar" (clicked)="onSearch(field.value)"></app-search-button>
    </div>
</div>
